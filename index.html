<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>">
    <title>Rabbit</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            color: #4a4a4a;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }

        h1 { text-align: center; margin-bottom: 5px; color: #333; }
        .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 25px; }

        .status-box {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .status-locked { background-color: #fff0f0; color: #d63031; border: 2px solid #ffcece; }
        .status-unlocked { background-color: #f0fff4; color: #00b894; border: 2px solid #b8e994; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        
        input {
            flex-grow: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #00b894; }
        input:disabled { background-color: #f9f9f9; cursor: not-allowed; border-color: #eee; }

        button#add-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.2s;
        }
        
        .btn-active { background-color: #00b894; box-shadow: 0 4px 10px rgba(0, 184, 148, 0.2); }
        .btn-active:hover { background-color: #00a383; transform: translateY(-1px); }
        .btn-locked { background-color: #b2bec3; cursor: not-allowed; }

        ul { list-style: none; padding: 0; }
        
        .habit-item {
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            margin-bottom: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .habit-item:hover { border-color: #00b894; }

        .habit-info h4 { margin: 0 0 5px 0; font-size: 1rem; }
        .habit-stats { font-size: 0.8rem; color: #888; }
        
        .low-eff { color: #d63031; font-weight: bold; } 
        .high-eff { color: #00b894; font-weight: bold; }

        .actions button {
            margin-left: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .check-btn { background-color: #e3fcf3; color: #00b894; font-weight: bold;}
        .check-btn:hover { background-color: #d1f7ea; }
        
        .del-btn { background-color: transparent; color: #b2bec3; }
        .del-btn:hover { color: #d63031; }

    </style>
</head>
<body>

<div class="container">
    <h1>Rabbit 🐰</h1>
    <p class="subtitle">Wer zwei Hasen jagt, fängt keinen.</p>

    <div id="status-display" class="status-box status-unlocked">
        Loading...
    </div>

    <div class="input-group">
        <input type="text" id="habit-input" placeholder="New habit (e.g. Read 10 pages)">
        <button id="add-btn" class="btn-active">Add</button>
    </div>

    <ul id="habit-list"></ul>
</div>

<script>

    const MIN_DAYS = 3;
    const PASS_THRESHOLD = 80;

    let habits = JSON.parse(localStorage.getItem('rabbitData')) || [];

    const statusBox = document.getElementById('status-display');
    const inputEl = document.getElementById('habit-input');
    const addBtn = document.getElementById('add-btn');
    const listEl = document.getElementById('habit-list');

    function getHabitEfficiency(habit) {
        const start = new Date(habit.createdAt);
        const now = new Date();
        
        const actualDays = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;

        const effectiveDays = Math.max(MIN_DAYS, actualDays);
        
        let percent = (habit.completions / effectiveDays) * 100;
        return Math.min(100, Math.floor(percent)); 
    }

    function getGlobalEfficiency() {
        if (habits.length === 0) return 100; 
        let total = habits.reduce((sum, h) => sum + getHabitEfficiency(h), 0);
        return Math.floor(total / habits.length);
    }

    function render() {
        listEl.innerHTML = ''; 
        const globalEff = getGlobalEfficiency();
        
        const isLocked = globalEff < PASS_THRESHOLD && habits.length > 0;

        if (isLocked) {
            statusBox.className = "status-box status-locked";
            statusBox.innerHTML = `🔒 LOCKED<br><small>Efficiency: ${globalEff}% (Target: ${PASS_THRESHOLD}%)</small>`;
            inputEl.disabled = true;
            inputEl.placeholder = "Improve efficiency to unlock...";
            addBtn.className = "btn-locked";
            addBtn.innerText = "Locked";
        } else {
            statusBox.className = "status-box status-unlocked";
            statusBox.innerHTML = `🔓 UNLOCKED<br><small>Efficiency: ${globalEff}%</small>`;
            inputEl.disabled = false;
            inputEl.placeholder = "New habit name...";
            addBtn.className = "btn-active";
            addBtn.innerText = "Add";
        }

        habits.forEach((habit, index) => {
            const eff = getHabitEfficiency(habit);
            const colorClass = eff >= PASS_THRESHOLD ? 'high-eff' : 'low-eff';
            
            // Calculate days for display info
            const start = new Date(habit.createdAt);
            const now = new Date();
            const daysAlive = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;
            const warmupMsg = daysAlive < MIN_DAYS ? `(Warmup: Day ${daysAlive}/${MIN_DAYS})` : "";

            const li = document.createElement('li');
            li.className = 'habit-item';
            li.innerHTML = `
                <div class="habit-info">
                    <h4>${habit.name}</h4>
                    <span class="habit-stats ${colorClass}">${eff}% Efficiency</span> 
                    <span class="habit-stats" style="font-size:0.7em; color:#ccc;"> ${warmupMsg}</span>
                </div>
                <div class="actions">
                    <button class="check-btn" onclick="incrementHabit(${index})">✔</button>
                    <button class="del-btn" onclick="deleteHabit(${index})">✕</button>
                </div>
            `;
            listEl.appendChild(li);
        });
    }

    function addHabit() {
        if (inputEl.value.trim() === '') return;
        if (getGlobalEfficiency() < PASS_THRESHOLD && habits.length > 0) {
            alert("Finish your current habits first!");
            return;
        }

        const newHabit = {
            id: Date.now(),
            name: inputEl.value,
            createdAt: new Date().toISOString(),
            completions: 0
        };

        habits.push(newHabit);
        inputEl.value = '';
        saveAndRender();
    }

    function incrementHabit(index) {
        habits[index].completions++;
        saveAndRender();
    }

    function deleteHabit(index) {
        if(confirm("Delete this Rabbit?")) {
            habits.splice(index, 1);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('rabbitData', JSON.stringify(habits));
        render();
    }

    inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') addHabit() });
    addBtn.addEventListener('click', addHabit);
    
    render();

</script>
</body>
</html>
